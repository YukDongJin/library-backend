apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-backend  # 내 고유 이름으로 변경
  namespace: default    # 내 전용 네임스페이스
  labels:
    app: library-backend
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: library-backend
  template:
    metadata:
      labels:
        app: library-backend
        version: v1
    spec:
      serviceAccountName: library-service-account
      containers:
      - name: library
        image: 324547056370.dkr.ecr.us-east-1.amazonaws.com/library-api:66d475ca663ab969b391ccb6d4462fbb54e7c8fd
        ports:
        - containerPort: 8001
          name: http
        env:
        - name: DEBUG
          value: "false"
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "8001"
        - name: DB_HOST
          value: "fproject-dev-postgres.c9eksq6cmh3c.us-east-1.rds.amazonaws.com"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "fproject_db"
        - name: DB_USER
          value: "fproject_user"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: library-db-secret
              key: password
        - name: AWS_REGION
          value: "us-east-1"
        - name: S3_BUCKET_NAME
          value: "library-bucket-youkkk"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false

---
apiVersion: v1
kind: Service
metadata:
  name: library-backend-service  # 내 고유 서비스 이름
  namespace: default       # 내 전용 네임스페이스
  labels:
    app: library-backend
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8001
    protocol: TCP
    name: http
  selector:
    app: library-backend

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: library-backend-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: "a3c22a2b065a64df888bad01f3cffa1a"  # 체크된 ALB 사용
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
spec:
  rules:
  - host: www.aws11.shop  # 팀원에게 확인 필요
    http:
      paths:
      - path: /library
        pathType: Prefix
        backend:
          service:
            name: library-backend-service
            port:
              number: 80

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: library-service-account
  namespace: default
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::324547056370:role/library-secrets-role

---
# AWS Secrets Manager에서 가져오는 간단한 Secret
apiVersion: v1
kind: Secret
metadata:
  name: library-db-secret
  namespace: default
  annotations:
    # AWS Secrets Manager에서 자동 동기화
    secrets-manager.io/secret-name: "library-api/db-password"
    secrets-manager.io/region: "us-east-1"
type: Opaque
data:
  # 이 값은 AWS Secrets Manager에서 자동으로 채워짐
  password: ""