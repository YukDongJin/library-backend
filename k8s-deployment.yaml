apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-backend  # 내 고유 이름으로 변경
  namespace: default    # 내 전용 네임스페이스
  labels:
    app: library-backend
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: library-backend
  template:
    metadata:
      labels:
        app: library-backend
        version: v1
    spec:
      serviceAccountName: library-service-account
      containers:
      - name: library
        image: 324547056370.dkr.ecr.us-east-1.amazonaws.com/library-api:27
        ports:
        - containerPort: 8001
          name: http
        env:
        - name: DEBUG
          value: "true"
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "8001"
        - name: DEBUG
          value: "true"
        - name: DB_HOST
          value: "fproject-dev-postgres.c9eksq6cmh3c.us-east-1.rds.amazonaws.com"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "fproject_db"
        - name: DB_USER
          value: "fproject_user"
        - name: DB_PASSWORD
          value: ""
        - name: USE_SECRETS_MANAGER
          value: "true"
        - name: DB_SECRET_NAME
          value: "library-api/db-password"
        - name: AWS_REGION
          value: "us-east-1"
        - name: S3_BUCKET_NAME
          value: "library-bucket-youkkk"
        - name: ALLOWED_ORIGINS
          value: "*"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false

---
apiVersion: v1
kind: Service
metadata:
  name: library-backend-service
  namespace: default
  labels:
    app: library-backend
spec:
  type: NodePort
  ports:
  - port: 8001
    targetPort: 8001
    nodePort: 31000
    protocol: TCP
    name: http
  selector:
    app: library-backend

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: library-service-account
  namespace: default
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::324547056370:role/library-secrets-role
