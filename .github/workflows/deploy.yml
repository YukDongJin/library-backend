name: Deploy Backend to EKS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: library-api
  EKS_CLUSTER_NAME: fproject-dev-eks

jobs:
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Create ECR repository if not exists
      run: |
        aws ecr describe-repositories --repository-names $ECR_REPOSITORY --region $AWS_REGION 2>/dev/null || \
        aws ecr create-repository --repository-name $ECR_REPOSITORY --region $AWS_REGION

    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        echo "Building Docker image..."
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
        
        echo "Pushing image to ECR..."
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        
        echo "Image pushed successfully: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER_NAME

    - name: Deploy to EKS
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # 이미지 태그를 새로운 커밋 SHA로 업데이트
        sed -i "s|324547056370.dkr.ecr.us-east-1.amazonaws.com/library-api:latest|$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG|g" k8s-deployment.yaml
        
        echo "Creating namespace first..."
        kubectl create namespace library-api-ns --dry-run=client -o yaml | kubectl apply -f -
        
        echo "Waiting for namespace to be ready..."
        sleep 5
        
        echo "Applying Kubernetes manifests..."
        kubectl apply -f k8s-deployment.yaml
        
        echo "Waiting for rollout to complete..."
        kubectl rollout status deployment/library-backend -n library-api-ns --timeout=300s
        
        echo "Checking pod status..."
        kubectl get pods -l app=library-backend -n library-api-ns
        
        echo "Checking service status..."
        kubectl get service library-backend-service -n library-api-ns

    - name: Verify deployment
      run: |
        echo "Deployment completed successfully!"
        echo "You can check the status with:"
        echo "kubectl get pods -l app=library-backend -n library-api-ns"
        echo "kubectl logs -l app=library-backend -n library-api-ns"